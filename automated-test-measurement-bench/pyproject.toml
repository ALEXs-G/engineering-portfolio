[project]
name = "automated-test-measurement-bench"
version = "0.1.0"
description = "Requirement-driven automated test workflow with a simulated DUT"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
