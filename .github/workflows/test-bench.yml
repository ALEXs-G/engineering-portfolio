name: portfolio-checks

on:
  push:
  pull_request:

jobs:
  test-bench:
    name: Test bench (pytest, lint, simulated campaign)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: automated-test-measurement-bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest
      - name: Simulated test campaign (fails on any FAIL/ERROR or undetected fault)
        run: python examples/run_campaign.py --out results/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-results-py${{ matrix.python-version }}
          path: automated-test-measurement-bench/results/ci

  analysis-reproducibility:
    name: Analysis scripts reproduce committed results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r thermocouple-temperature-system/analysis/requirements.txt -r cellular-traffic-simulation/requirements.txt
      - name: Thermocouple characterization is up to date
        run: |
          python thermocouple-temperature-system/analysis/characterize.py
          git diff --exit-code thermocouple-temperature-system/results/characterization.md
      - name: Erlang-B simulation runs headless
        working-directory: cellular-traffic-simulation
        env:
          MPLBACKEND: Agg
        run: python erlang_b_simulation.py

  matlab-lint:
    name: MATLAB static check (MISS_HIT, no MATLAB runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install miss_hit
      - run: mh_lint grid-tied-hybrid-energy-system
